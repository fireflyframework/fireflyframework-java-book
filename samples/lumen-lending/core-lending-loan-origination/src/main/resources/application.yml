# Runnable configuration for the core (system-of-record) tier.
#
# The slice boots on an in-memory H2 database so it serves real requests with NO
# external DB and NO Docker. R2DBC is the runtime (reactive) data access; Flyway
# migrates over JDBC. Both point at the SAME in-memory H2 database (name "lumen",
# DB_CLOSE_DELAY=-1 keeps it alive for the whole JVM) so the table Flyway creates
# is the one R2DBC reads. This mirrors src/test/resources/application.yml.
server:
  port: 8081

spring:
  application:
    name: core-lending-loan-origination
  r2dbc:
    url: r2dbc:h2:mem:///lumen;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    url: jdbc:h2:mem:lumen;DB_CLOSE_DELAY=-1
    user: sa
    password: ""
